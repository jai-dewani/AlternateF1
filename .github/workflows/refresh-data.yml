name: Refresh F1 Data

on:
  schedule:
    # Run every Monday and Tuesday at 06:00 UTC (after race weekends)
    - cron: '0 6 * * 1,2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and compute season data
        run: node scripts/refresh.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/season.json data/raw/
          git diff --cached --quiet || git commit -m "chore: refresh season data [skip ci]"
          git push
